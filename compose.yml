services:

  app:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    command: [ "sh", "-c", "/myapp/bin/migration up && /myapp/bin/app" ]
    restart: always

  db:
    image: postgres:18-alpine
    environment:
      TZ: "Asia/Singapore"
      POSTGRES_DB: book-service-db
      POSTGRES_USER: book-service-user
      POSTGRES_PASSWORD: book-service-pass
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U book-service-user -d book-service-db" ]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: always